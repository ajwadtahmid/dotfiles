# SECURITY WARNING: Credentials below are for LOCAL DEVELOPMENT ONLY.
# Never use them in production, staging, or any network-exposed environment.
services:

  # ─── Dev container ──────────────────────────────────────────────────────────
  app:
    # Pin a reproducible build by exporting DEVENV_TAG=YYYY.MM.DD (a dated tag
    # published by .github/workflows/devenv.yml). Defaults to :latest so it
    # always resolves.
    image: ghcr.io/ajwadtahmid/devenv:${DEVENV_TAG:-latest}
    # The docker-in-docker devcontainer feature needs a privileged container to
    # run its inner daemon. In compose mode the devcontainer CLI does not inject
    # this for us, so it has to be set here. init reaps the daemon's orphans.
    privileged: true
    init: true
    volumes:
      - ..:/workspace:cached               # Project root (one level up from .devcontainer/)
      - ~/.ssh:/home/dev/.ssh:ro           # SSH keys for git over SSH
      - ~/.gitconfig:/home/dev/.gitconfig:ro
      - ~/.claude:/home/dev/.claude        # Claude Code credentials (Pro/Max OAuth)
    command: sleep infinity                # Keep the container alive
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - POSTGRES_URL=postgresql://dev:dev@postgres:5432/devdb
      - MYSQL_URL=mysql://dev:dev@mysql:3306/devdb
      # Username must be "default" (the implicit user under --requirepass).
      # Omitting it works in some clients but fails in redis-cli with WRONGPASS.
      - REDIS_URL=redis://default:dev@redis:6379
      # authSource=admin is required: MONGO_INITDB_ROOT_* creates the user in
      # the admin database, so authenticating against devdb alone fails.
      - MONGO_URL=mongodb://dev:dev@mongo:27017/devdb?authSource=admin
      - SQLITE_PATH=/workspace/db.sqlite3
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host side remapped to 5433 to avoid clashing with a baremetal PostgreSQL
      # on 5432. Inside the dev container, code still connects via "postgres:5432"
      # over the compose network — this mapping only affects host-side access.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootdev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_DATABASE: devdb
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Host side remapped to 3307 to avoid clashing with a baremetal MariaDB on
      # 3306. Inside the dev container, code still connects via "mysql:3306" over
      # the compose network — this mapping only affects host-side access.
      - "127.0.0.1:3307:3306"
    healthcheck:
      # Using MYSQL_PWD avoids the "password on command line is insecure" warning
      test: ["CMD-SHELL", "MYSQL_PWD=dev mysqladmin ping -h localhost -u dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass dev
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # -a is required because the server runs with --requirepass above.
      test: ["CMD", "redis-cli", "-a", "dev", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
      MONGO_INITDB_DATABASE: devdb
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

# ─── Named volumes ─────────────────────────────────────────────────────────────
# To wipe a database and start fresh, delete its volume:
#   docker volume rm .devcontainer_postgres_data
#
# Database image tags are pinned to MAJOR versions on purpose — never use
# `latest` for a stateful service. To bump a major version (e.g. postgres:17 ->
# 18, mysql:8.4 -> 9.x), the existing data directory is usually NOT
# forward-compatible: either start fresh by deleting that DB's volume (above),
# or run the engine's documented upgrade path (e.g. pg_upgrade) before switching.
volumes:
  postgres_data:
  mysql_data:
  redis_data:
  mongo_data:

name: Build devenv image

# Builds docker/Dockerfile and pushes it to the GitHub Container Registry so
# ghcr.io/<owner>/devenv stays fresh instead of being built by hand. The image
# is amd64-only (see the architecture note in docker/Dockerfile).
#
# Tags pushed on every successful build:
#   - latest            moving tag (opt-in convenience)
#   - YYYY.MM.DD         immutable dated tag — pin your devcontainer to this
#   - <short-sha>        exact commit that produced the image

on:
  push:
    branches: [master]
    paths:
      - 'docker/**'
      - '.github/workflows/devenv.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly (Mon 06:00 UTC) to pick up base-image/security updates
  workflow_dispatch:

concurrency:
  group: devenv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devenv
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD'}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
